   <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #282329" x="34.992" y="69.9192" transform="rotate(-0 34.992 69.9192)">What else was found at urine albumin grade 0?</text>
  </g>
  <g id="text_12">
   <text style="font-size: 11.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #615961" x="36.5472" y="98.1396" transform="rotate(-0 36.5472 98.1396)">One mark per person. All 45 had grade 0 and known results for both anemia and random glucose.</text>
  </g>
  <g id="text_13">
   <text style="font-weight: 700; font-size: 10.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #282329" x="36.5472" y="378.6588" transform="rotate(-0 36.5472 378.6588)">16 of 45 had anemia or high glucose. Record 43 was one of the two who had both.</text>
  </g>
  <g id="text_14">
   <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #615961" x="36.5472" y="399.2976" transform="rotate(-0 36.5472 399.2976)">Across all grades, 70/175 had at least two findings. With missing values, the full-cohort bounds are 79–122 of 250.</text>
  </g>
 </g>
