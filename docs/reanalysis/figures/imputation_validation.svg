   <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182b35" x="18" y="25.427588" transform="rotate(-0 18 25.427588)">How far does a median fill miss a held-out value?</text>
  </g>
  <g id="text_38">
   <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #405460" x="18" y="49.471959" transform="rotate(-0 18 49.471959)">Each observed value was withheld once. Predictions use the pooled training-fold median.</text>
  </g>
  <g id="text_39">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #405460" x="18" y="353.2464" transform="rotate(-0 18 353.2464)">Negative signed errors indicate underestimation. Error for truly missing records remains unknown.</text>
  </g>
 </g>
