 <title>How far does a median fill miss a held-out value?</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>How far does a median fill miss a held-out value?</dc:title>
    <dc:description>Five rows contrast diagnosis-specific signed validation errors on a common training-IQR scale and mean absolute errors in original units. For creatinine, the median standardized signed error is -0.51 in CKD and +0.20 in non-CKD.</dc:description>
